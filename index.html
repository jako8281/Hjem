<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skak Turnering</title>

<style>
:root{
    --bg:#262522;
    --card:#312e2b;
    --green:#81b64c;
    --green-hover:#94c85d;
    --text:#ffffff;
    --light:#d9d9d9;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, Helvetica, sans-serif;
}

html, body { height: 100%; }

body{
    background:var(--bg);
    color:var(--text);
    display:flex;
    justify-content:center;
    padding:10px 8px; /* mindre top/bund-padding for at få plads */
    font-size:13px; /* mindre base-font */
}

.container{
    width:100%;
    max-width:900px;
    text-align:center;
    height: calc(100vh - 20px); /* fylder viewport højden så matches kan vises */
    display:flex;
    flex-direction:column;
}

h1{
    margin-bottom:8px;
    font-size:1.25rem; /* mindre titel */
}

.card{
    background:var(--card);
    padding:10px; /* mindre padding */
    border-radius:10px;
    margin-bottom:8px;
}

textarea{
    width:100%;
    height:90px; /* mindre højde */
    border:none;
    border-radius:8px;
    padding:8px;
    resize:vertical;
    font-size:13px;
}

button{
    background:var(--green);
    color:white;
    border:none;
    padding:8px 14px; /* mindre knap */
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    margin-top:8px;
}

button:hover{
    background:var(--green-hover);
}

/* Matches-listen fylder den resterende plads og gør interne elementer kompakte */
#matches{
    margin-top:8px;
    overflow:auto;
    padding-right:6px; /* plads til scrollbar */
    flex:1 1 auto;
}

.match{
    background:#3a3734;
    border-radius:8px;
    padding:8px; /* mindre padding */
    margin-bottom:6px; /* tættere kampe */
    display:flex;
    flex-direction:column;
    gap:6px;
}

.match h3{ font-size:13px; margin:0; }

.players{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:6px; /* mindre gap */
}

.white{
    background:white;
    color:black;
    padding:6px 8px; /* mindre */
    border-radius:6px;
    flex:1;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.black{
    background:black;
    color:white;
    padding:6px 8px; /* mindre */
    border-radius:6px;
    flex:1;
    font-size:13px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.vs{
    font-weight:bold;
    margin:0 6px;
    font-size:12px;
}

.result-buttons{
    display:flex;
    gap:6px;
    justify-content:center;
    flex-wrap:wrap;
}

.result-buttons button{
    margin:0;
    padding:6px 8px; /* mindre */
    font-size:12px;
}

.result{
    margin-top:4px;
    font-weight:bold;
    color:#ffd966;
    font-size:12px;
}

.bye{
    background:#3a3734;
    padding:8px;
    border-radius:8px;
    margin-bottom:6px;
}

small{ color:#bdbdbd; }

/* Responsivt: på meget små skærme mindskes mellemrum yderligere */
@media (max-width:420px){
    body{ padding:8px 6px; }
    textarea{ height:70px; }
    .card{ padding:8px; }
    .match{ padding:6px; margin-bottom:6px; }
    h1{ font-size:1.05rem; }
}
</style>
</head>
<body>

<div class="container">

<h1>♟ Skak Partigenerator</h1>

<div class="card">
    <h3>Deltagere</h3>
    <br>
    <textarea id="players" placeholder="Skriv én deltager pr. linje"></textarea>
    <br>
    <button onclick="generateMatches()">Start Partier</button>
</div>

<div id="matches"></div>

</div>

<script>

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
}

function saveData() {
    localStorage.setItem(
        "chessTournament",
        document.getElementById("matches").innerHTML
    );
}

function generateMatches() {

    let players = document
        .getElementById("players")
        .value
        .split("\n")
        .map(p => p.trim())
        .filter(p => p !== "");

    if(players.length < 2){
        alert("Indtast mindst 2 deltagere.");
        return;
    }

    shuffle(players);

    let html = "";

    if(players.length % 2 !== 0){
        let bye = players.pop();

        html += `
        <div class="bye">
            ✅ Oversidder: <strong>${bye}</strong>
        </div>
        `;
    }

    let board = 1;

    for(let i = 0; i < players.length; i += 2){

        let white = players[i];
        let black = players[i+1];

        html += `
        <div class="match">
            <h3>Bræt ${board}</h3>

            <div class="players">
                <div class="white">⚪ ${white}</div>
                <div class="vs">VS</div>
                <div class="black">⚫ ${black}</div>
            </div>

            <div class="result-buttons">
                <button onclick="setResult(this,'⚪ Hvid vandt')">Hvid vandt</button>

                <button onclick="setResult(this,'⚫ Sort vandt')">Sort vandt</button>

                <button onclick="setResult(this,'🤝 Remi')">Remi</button>
            </div>

            <div class="result"></div>
        </div>
        `;

        board++;
    }

    document.getElementById("matches").innerHTML = html;
    saveData();
}

function setResult(button, text){

    const result = button
        .closest(".match")
        .querySelector(".result");

    result.textContent = "Resultat: " + text;

    saveData();
}

window.onload = function(){

    const savedMatches =
        localStorage.getItem("chessTournament");

    if(savedMatches){
        document.getElementById("matches").innerHTML =
            savedMatches;
    }
};

</script>

</body>
</html>
